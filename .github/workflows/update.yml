name: TFX daily update and publish

on:
  schedule:
    - cron: '30 1 * * *'  # 日本時間10:30（UTC 01:30）。遅延する場合があります。
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'auto_update/**'
      - '!auto_update/data/**'
      - '!auto_update/logs/**'
      - 'dist/*.html'
      - 'dist/*.js'
      - 'dist/*.css'

concurrency:
  group: tfx-daily-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed strategy and error handling tests
        run: python -m unittest discover -s auto_update/tests -v
      - name: Fetch official TFX data
        id: update
        continue-on-error: true
        run: python auto_update/update_dow_nikkei.py --site-dir dist
      - name: Update silver-platinum frozen V3
        id: metals
        continue-on-error: true
        run: python auto_update/update_metals.py --site-dir dist
      - name: Persist data and logs, including error state
        run: |
          git config user.name "TFX data updater"
          git config user.email "tfx-updater@users.noreply.github.com"
          git add auto_update/data auto_update/logs dist/dow-nikkei.csv dist/dow-nikkei-status.json dist/silver-platinum.csv dist/silver-platinum-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update TFX data and status"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish success or DATA UPDATE ERROR screen
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Mark data failure after publishing the warning
        if: steps.update.outcome == 'failure' || steps.metals.outcome == 'failure'
        run: |
          echo "One or more TFX data updates failed. The warning status has been published; previous validated prices were retained."
          exit 1
