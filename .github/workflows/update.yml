name: TFX daily update and publish

# recovery kick 2026-11-28 10:58 JST; staggered schedule remains unchanged.
on:
  schedule:
    # GitHubのscheduleは混雑時に遅延・欠落し得るため、正時・30分を避けて複数回再試行する。
    # JST 09:07〜13:47（UTC 00:07〜04:47）、平日の各時07/27/47分。
    - cron: '7,27,47 0-4 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'auto_update/**'
      - '!auto_update/data/**'
      - '!auto_update/logs/**'
      - 'dist/*.html'
      - 'dist/*.js'
      - 'dist/*.css'
      - 'dist/viewer-calendar.json'
      - 'scripts/audit-viewer.cjs'

concurrency:
  group: tfx-daily-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pages: read
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
      data_failed: ${{ steps.update.outcome == 'failure' || steps.metals.outcome == 'failure' || steps.viewer.outcome == 'failure' || steps.viewer_audit.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Re-runs must start from the latest persisted main, not the old triggering SHA.
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fixed strategy and error handling tests
        run: python -m unittest discover -s auto_update/tests -v
      - name: Fetch official TFX data
        id: update
        continue-on-error: true
        run: python auto_update/update_dow_nikkei.py --site-dir dist
      - name: Update silver-platinum frozen V3
        id: metals
        continue-on-error: true
        run: python auto_update/update_metals.py --site-dir dist
      - name: Update independent metal chart history
        id: viewer
        continue-on-error: true
        run: python auto_update/update_viewer.py --site-dir dist
      - name: Rebuild Viewer V2 diagnostics from retained source prices
        id: viewer_audit
        continue-on-error: true
        run: node scripts/audit-viewer.cjs
      - name: Persist data and logs, including error state
        run: |
          git config user.name "TFX data updater"
          git config user.email "tfx-updater@users.noreply.github.com"
          git add auto_update/data auto_update/logs dist/dow-nikkei.csv dist/dow-nikkei-status.json dist/silver-platinum.csv dist/silver-platinum-status.json dist/metals-viewer.json dist/metals-viewer-status.json dist/metals-viewer-audit.json dist/viewer-v1-gaps.csv dist/viewer-v2-gaps.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update TFX data and status"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Set unique Pages artifact name
        id: artifact-name
        run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: dist

  deploy:
    needs: update-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.update-build.outputs.artifact_name }}
        run: |
          for attempt in $(seq 1 18); do
            if count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${ARTIFACT_NAME}" --jq '[.artifacts[] | select(.expired == false)] | length') && [ "$count" = "1" ]; then
              echo "Pages artifact is visible to the API."
              sleep 15
              exit 0
            fi
            echo "Waiting for Pages artifact metadata (attempt $attempt/18)"
            sleep 5
          done
          echo "::error::Pages artifact metadata was not available; no deployment attempted."
          exit 1
      - name: Publish success or DATA UPDATE ERROR screen
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.update-build.outputs.artifact_name }}
      - name: Mark data failure after publishing the warning
        if: needs.update-build.outputs.data_failed == 'true'
        run: |
          echo "One or more TFX data updates failed. The warning status has been published; previous validated prices were retained."
          exit 1
